spring.application.name=metropolitano-backend-api
spring.profiles.default=demo
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.repositories.enabled=false
server.error.include-message=always
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
# Redis is not used by this demo; do not require a Redis server for its health check.
management.health.redis.enabled=false
spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_DB_USER}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
# The shared schema stores timestamps in UTC without a time-zone column.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
