name: Metropolitano CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  apf3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apf3/requirements.txt
      - run: python -m pip install -r apf3/requirements.txt
      - run: python -m flake8 apf3 --max-line-length=88
      - run: python -m pytest apf3/tests -q
      - run: docker build -t metropolitano-apf3:ci apf3
  spring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/metropolitano-backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - run: docker build -t metropolitano-spring:ci .
  clientes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/metropolitano-mobile-app/MetropolitanoMobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/metropolitano-mobile-app/MetropolitanoMobileApp/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx expo install --check
      - run: npx tsc --noEmit && npx tsc -p web --noEmit
      - run: npm run lint && npm test -- --runInBand
      - run: npm run build:web
      - run: npx expo export --platform android
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/metropolitano-mobile-app/MetropolitanoMobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/metropolitano-mobile-app/MetropolitanoMobileApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1 cmake;3.30.5'
      - run: npm ci
      - name: Comprobar URLs del APK público
        if: vars.ENABLE_VERCEL_DEPLOY == 'true'
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_URL: ${{ vars.EXPO_PUBLIC_AI_URL }}
        run: |
          node --input-type=module <<'JS'
          for (const name of ['EXPO_PUBLIC_API_URL', 'EXPO_PUBLIC_AI_URL']) {
            if (!URL.canParse(process.env[name]) || new URL(process.env[name]).protocol !== 'https:') {
              throw new Error(`Configura una URL HTTPS para ${name}`);
            }
          }
          JS
      - run: npm run apk
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_URL: ${{ vars.EXPO_PUBLIC_AI_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: metropolitano-android-arm64
          path: frontend/metropolitano-mobile-app/MetropolitanoMobileApp/artifacts/metropolitano.apk
          if-no-files-found: error
  deploy-vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    needs: [apf3, spring, clientes, apk]
    runs-on: ubuntu-latest
    environment: production
    concurrency: vercel-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publicar APIs y luego web
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          SPRING_PROJECT: ${{ vars.VERCEL_SPRING_PROJECT_ID }}
          APF3_PROJECT: ${{ vars.VERCEL_APF3_PROJECT_ID }}
          WEB_PROJECT: ${{ vars.VERCEL_WEB_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AI_URL: ${{ vars.EXPO_PUBLIC_AI_URL }}
        run: |
          set -eu
          deploy() {
            VERCEL_PROJECT_ID="$1" npx --yes vercel@66.2.0 deploy . --prod --yes --token "$VERCEL_TOKEN"
          }
          health() {
            curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 20 "$1" > /dev/null
          }
          deploy "$SPRING_PROJECT"
          health "${EXPO_PUBLIC_API_URL%/api/v1/demo}/actuator/health"
          deploy "$APF3_PROJECT"
          health "${EXPO_PUBLIC_AI_URL%/}/health"
          deploy "$WEB_PROJECT"
